[workspace]
resolver = "3"
members = ["crates/poker-core", "crates/bot", "crates/poker-wasm", "crates/pvp-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
poker-core = { path = "crates/poker-core" }
bot = { path = "crates/bot" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
