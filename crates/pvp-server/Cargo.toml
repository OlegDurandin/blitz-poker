[package]
name = "pvp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authoritative server for private Blitz Poker duels (VK Mini App)"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
form_urlencoded = "1.2.2"
futures-util = "0.3.34"
getrandom = "0.4.3"
hmac = "0.13.0"
poker-core.workspace = true
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.30.0"
