<!doctype html><html lang="ru"><meta charset="utf-8"><title>Blitz Poker 3.1 — проверка интерфейса</title><style>body{margin:0;background:#091321;color:#e8f3ff;font:14px system-ui}header{padding:16px 24px;display:flex;gap:16px;align-items:center;position:sticky;top:0;background:#091321;z-index:3}select,button{font:inherit;background:#213b58;color:#fff;border:1px solid #6385a8;border-radius:6px;padding:8px}main{display:flex;gap:16px;padding:0 24px;align-items:flex-start}section{flex-shrink:0}h2{font-size:14px}iframe{border:1px solid #47617e;border-radius:12px;height:810px;background:#101a2b}#report{font:12px monospace;white-space:pre-wrap;padding:16px 24px}p{margin:0;color:#9db4cb}</style>
<header><strong>Blitz Poker 3.1</strong><select id="scene" aria-label="Экран"><option value="table4">Стол · 4 места</option><option value="table3">Стол · 3 места</option><option value="table2">Стол · 2 места</option><option value="lobby">Лобби</option><option value="showdown">Вскрытие</option><option value="raise">Выбор ставки</option><option value="home">Главная</option></select><select id="version" aria-label="Версия"><option value="">После</option><option value="before-">До</option></select><button id="run">Проверить все ширины</button><button id="matrix">Все экраны</button><p>Браузерная проверка. Реальные VK/TG WebView проверяются отдельно.</p></header>
<main id="frames"></main><div id="report"></div>
<script>
const results=[];let matrix=false;
function show(widths=[320,375,430]){results.length=0;document.getElementById('report').textContent='Проверяем геометрию…';const scene=document.getElementById('scene').value;const prefix=document.getElementById('version').value;document.getElementById('frames').innerHTML=widths.map(w=>`<section><h2>${w} px</h2><iframe title="${scene}, ${w} px" src="${prefix}${scene}.html" width="${w}"></iframe></section>`).join('');}
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const f=[...document.querySelectorAll('iframe')].find(f=>f.contentWindow===e.source);if(f?.style.left==='-10000px')f.remove();results.push(e.data);document.getElementById('report').innerHTML=results.map(r=>`<p role="status">${r.fixture} ${r.width}px: ${r.overflow?'OVERFLOW':'нет горизонтального скролла'}; обрезано: ${r.clipped.join(', ')||'нет'}</p>`).join('');});
document.getElementById('scene').onchange=()=>show();document.getElementById('version').onchange=()=>show();document.getElementById('run').onclick=()=>show([320,360,375,390,430,768]);document.getElementById('matrix').onclick=()=>{results.length=0;document.getElementById('report').textContent='Проверка 42 вариантов';for(const scene of ['home','table2','table3','table4','lobby','showdown','raise'])for(const width of [320,360,375,390,430,768]){const f=document.createElement('iframe');f.width=width;f.height=720;f.src=scene+'.html';f.style.cssText='position:absolute;left:-10000px;top:0';document.body.appendChild(f)}};
show();
</script></html>
